      <h1 class="">文字接龙：下一个词从概率榜里跳出</h1>
      <p class="intro">大模型每蹦一个词之前，手里都攥着一张候选词概率榜。看这张榜，怎么一步一步把句子接出来。</p>

      <div class="player-shell">
        <hyperframes-player
          id="player"
          src="compositions/ih-next-token.html"
          controls
        ></hyperframes-player>
        <audio id="narration" src="compositions/ih-next-token.mp3" preload="auto"></audio>
      </div>

      <!-- 父级 audio 同步（pitfalls §3） -->
      <script>
        (function() {
          const player = document.getElementById('player');
          const audio = document.getElementById('narration');
          let syncing = false;
          player.addEventListener('play', () => {
            if (player.currentTime >= player.duration - 0.1) {
              player.seek(0);
              audio.currentTime = 0;
            }
            audio.play().catch(() => {});
          });
          player.addEventListener('pause', () => audio.pause());
          player.addEventListener('ended', () => audio.pause());
          player.addEventListener('timeupdate', (e) => {
            const t = e.detail && e.detail.currentTime != null ? e.detail.currentTime : player.currentTime;
            if (!audio.duration) return;
            if (t > audio.duration) { audio.pause(); return; }
            if (Math.abs(audio.currentTime - t) > 0.25 && !syncing) {
              syncing = true;
              audio.currentTime = t;
              setTimeout(() => syncing = false, 50);
            }
          });
          // 轮询兜底：点击/拖动 scrubber 会让 player 静默暂停（不发 pause 事件），
          // 不轮询会导致 composition 冻结而音频继续播放（QA 实测确认）。
          setInterval(() => {
            if (player.paused && !audio.paused) audio.pause();
          }, 200);
        })();
      </script>

      <div class="takeaways">
        <h4>关键点</h4>
        <ul>          <li><b>逐词生成</b>｜每步只接一个词，接完再算下一张榜</li>
          <li><b>概率榜</b>｜候选词各带概率，最高者出线</li>
          <li><b>候选 = 表征</b>｜榜上每个词，都是此刻可调用的内部表征</li></ul>
